name: CI


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:




jobs:
  build-and-test:
    env: 
      BUILD_CONFIGURATION: Release
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: restore
        run: dotnet restore
      - name: build
        run: dotnet build --no-restore --configuration $BUILD_CONFIGURATION
      - name: test
        run: dotnet test --no-build --configuration ${{ env.BUILD_CONFIGURATION }}
      - name: Vem och vad staartade det här?
        env:
          author: ${{ github.actor }}
          event: ${{ github.event_name }}
          branch: ${{ github.ref_name }}
        run: |
          echo "Startad av $author - händelse: $event - gren: $branch"
          
          
          
